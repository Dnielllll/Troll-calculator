<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculator Pro+</title>
<style>
:root{--bg:#f2f2f7;--digit:#fff;--digit-t:#000;--fn:#d1d1d6;--fn-t:#000;--op:#ff9f0a;--op-t:#fff;--txt:#000;--sheet:#fff;--sub:#6c6c70;--sep:#e5e5ea;--blue:#0a84ff;--press:#c7c7cc}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--digit:#333336;--digit-t:#fff;--fn:#a5a5a8;--fn-t:#000;--txt:#fff;--sheet:#1c1c1e;--sub:#98989d;--sep:#38383a;--press:#737376}}
:root[data-theme="dark"]{--bg:#000;--digit:#333336;--digit-t:#fff;--fn:#a5a5a8;--fn-t:#000;--txt:#fff;--sheet:#1c1c1e;--sub:#98989d;--sep:#38383a;--press:#737376}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Inter,Arial,sans-serif;overflow:hidden;user-select:none}
.app{max-width:420px;height:100%;margin:0 auto;padding:0 16px 14px;display:flex;flex-direction:column;justify-content:flex-end}
#disp{text-align:right;font-weight:300;font-size:88px;line-height:1.05;padding:0 8px 14px;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums;letter-spacing:-1px}
#disp.lock{color:var(--sub);letter-spacing:6px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.keys button{aspect-ratio:1;border:0;border-radius:50%;font:inherit;font-size:clamp(26px,8vw,34px);background:var(--digit);color:var(--digit-t);cursor:pointer;transition:background .25s}
.keys button:active{background:var(--press);transition:none}
.keys .fn{background:var(--fn);color:var(--fn-t)}
.keys .fn:active{filter:brightness(1.25)}
.keys .op{background:var(--op);color:var(--op-t);font-size:clamp(32px,10vw,42px)}
.keys .op:active{filter:brightness(1.3)}
.keys .op.on{background:#fff;color:var(--op)}
.keys .zero{grid-column:span 2;aspect-ratio:auto;border-radius:999px;text-align:left;padding-left:8%}
#back{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s}
#back.show{opacity:1;pointer-events:auto}
#sheet{max-height:94%;overflow-y:auto;position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:420px;background:var(--sheet);border-radius:28px 28px 0 0;padding:10px 24px calc(20px + env(safe-area-inset-bottom,0px));text-align:center;transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.9,.25,1)}
#back.show #sheet{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--sep);margin:0 auto 18px}
.icon{width:64px;height:64px;border-radius:15px;margin:0 auto 14px;background:linear-gradient(145deg,#ffb340,#ff6a00);display:grid;place-items:center;font-size:32px;color:#fff;box-shadow:0 6px 16px rgba(255,120,0,.35)}
#t{font-size:24px;font-weight:700;margin:0 0 8px}
#d{font-size:15px;line-height:1.4;color:var(--sub);margin:0 0 20px;min-height:42px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border:0;border-radius:14px;font:inherit;font-size:17px;font-weight:600;cursor:pointer}
.btn.p{background:var(--blue);color:#fff}
.btn.s{background:none;color:var(--blue);font-weight:500;margin-top:6px}
.btn:disabled{opacity:.7;cursor:default}
.btn:active:not(:disabled){filter:brightness(.88)}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:r .7s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.fine{font-size:11px;color:var(--sub);margin:12px 0 0}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-150%);background:var(--sheet);color:var(--txt);padding:12px 18px;border-radius:20px;box-shadow:0 8px 30px rgba(0,0,0,.3);font-size:14px;font-weight:500;max-width:90%;text-align:center;transition:transform .45s cubic-bezier(.2,.9,.25,1)}
#toast.show{transform:translate(-50%,0)}
#qrv{display:none}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 16px}
.plan{position:relative;border:2px solid var(--sep);background:none;color:var(--txt);border-radius:16px;padding:16px 8px 12px;font:inherit;cursor:pointer;transition:border-color .2s,background .2s}
.plan b{display:block;font-size:13px;font-weight:600;color:var(--sub);margin-bottom:4px}
.plan span{font-size:22px;font-weight:700}
.plan small{display:block;font-size:12px;color:var(--sub);margin-top:2px}
.plan.sel{border-color:var(--blue);background:rgba(10,132,255,.1)}
.plan i{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#30d158;color:#fff;font-style:normal;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
#sheet.qr #offer{display:none}#sheet.qr #qrv{display:block}
.gc{display:inline-flex;align-items:center;gap:6px;background:#007cff;color:#fff;font-weight:700;font-size:15px;padding:6px 14px;border-radius:999px;margin-bottom:12px}
.qrbox{background:#fff;border-radius:18px;padding:10px;width:min(240px,68vw);margin:0 auto 12px;box-shadow:0 0 0 1px var(--sep)}
.qrbox img{display:block;width:100%;height:auto;image-rendering:pixelated}
#amt{font-size:30px;font-weight:700;margin:0 0 4px}
.btn.g{background:#007cff;color:#fff}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation-duration:.01s!important}}
</style>
</head>
<body>
<div class="app">
  <div id="disp">0</div>
  <div class="keys" id="keys">
    <button class="fn" data-k="C" id="ac">AC</button><button class="fn" data-k="neg">±</button><button class="fn" data-k="pct">%</button><button class="op" data-k="÷">÷</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="op" data-k="×">×</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button class="op" data-k="−">−</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button class="op" data-k="+">+</button>
    <button class="zero" data-k="0">0</button><button data-k=".">.</button><button class="op" data-k="=">=</button>
  </div>
</div>
<div id="back"><div id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div><div class="icon">🔒</div>
  <div id="offer">
   <h2 id="t"></h2><p id="d"></p>
   <div class="plans" id="plans">
    <button class="plan sel" data-p="m"><b>Monthly</b><span>₱500</span><small>per month</small></button>
    <button class="plan" data-p="y"><i>Save ₱1,000</i><b>Yearly</b><span>₱5,000</span><small>per year</small></button>
   </div>
   <button class="btn g" id="pay"></button><button class="btn s" id="no"></button>
  </div>
  <div id="qrv">
   <div class="gc">GCash</div>

<script>
var cur="0",acc=null,op=null,fresh=false,result=null,locked=false,level=0,busy=false;
var disp=document.getElementById("disp"),back=document.getElementById("back"),pay=document.getElementById("pay"),no=document.getElementById("no");
var L=[
 {t:"Unlock Your Result",d:"Choose a plan to reveal your answer. GCash only.",c:"Cancel"},
 {t:"Cancellation Fee",d:"Cancelling requires a ₱500 cancellation fee. GCash only.",p:"Pay ₱500 via GCash to Cancel",c:"Cancel"},
 {t:"Cancel the Cancellation?",d:"Cancelling the cancellation also costs ₱500. GCash only.",p:"Pay ₱500 via GCash to Cancel",c:"Cancel"},
 {t:"Are You Sure?",d:"Abandoning your result costs ₱500. It has feelings, you know.",p:"Pay ₱500 via GCash to Cancel",c:"Cancel Anyway"}
];
var plan="m";
function fee(){return level===0?(plan==="y"?"₱5,000":"₱500"):"₱500"}
function payLabel(){return level===0?"Subscribe "+(plan==="y"?"Yearly":"Monthly")+" · "+fee()+" with GCash":L[level].p}
document.getElementById("plans").addEventListener("click",function(e){var b=e.target.closest(".plan");if(!b||busy)return;
 plan=b.dataset.p;document.querySelectorAll(".plan").forEach(function(x){x.classList.toggle("sel",x===b)});pay.textContent=payLabel()});
function calc(a,b,o){var r=o==="+"?a+b:o==="−"?a-b:o==="×"?a*b:b===0?NaN:a/b;return isNaN(r)||!isFinite(r)?NaN:parseFloat(r.toPrecision(12))}
function fmt(s){if(s==="Error")return s;var neg=s[0]==="-",p=(neg?s.slice(1):s).split(".");
 if(/e/.test(p[0]))return s;p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,",");return(neg?"-":"")+p.join(".")}
function render(){
 disp.classList.toggle("lock",locked);
 var s=locked?"•••••":fmt(cur);disp.textContent=s;
 var n=s.length;disp.style.fontSize=(n<=6?88:n<=7?76:n<=8?68:n<=10?56:46)+"px";
 document.getElementById("ac").textContent=(cur!=="0"&&!fresh)?"C":"AC";
 document.querySelectorAll(".op").forEach(function(b){b.classList.toggle("on",fresh&&op===b.dataset.k)});
}
function key(k){
 if(busy||back.classList.contains("show"))return;
 if(cur==="Error"&&k!=="C")k="C";
 if(locked&&!/^[C]$/.test(k)&&!"÷×−+".includes(k)){locked=false}
 if(/^\d$/.test(k)){
  if(fresh||cur==="0"){cur=k;fresh=false}else if(cur.replace(/[-.]/g,"").length<9)cur+=k;
 }else if(k==="."){
  if(fresh){cur="0.";fresh=false}else if(!cur.includes("."))cur+=".";
 }else if(k==="C"){
  if(cur!=="0"&&!fresh){cur="0"}else{cur="0";acc=null;op=null;fresh=false}
  locked=false;
 }else if(k==="neg"){
  if(cur!=="0")cur=cur[0]==="-"?cur.slice(1):"-"+cur;
 }else if(k==="pct"){
  cur=String(parseFloat((parseFloat(cur)/100).toPrecision(12)));
 }else if("÷×−+".includes(k)){
  if(op&&!fresh){
   var r=calc(acc,parseFloat(cur),op);
   if(isNaN(r)){cur="Error";acc=null;op=null;fresh=false;render();return}
   acc=r;locked=true;
  }else if(acc===null||!op){acc=parseFloat(cur)}
  op=k;fresh=true;
 }else if(k==="="){
  if(!op)return;
  var res=calc(acc,parseFloat(cur),op);
  if(isNaN(res)){cur="Error";acc=null;op=null;fresh=false;render();return}
  result=res;locked=true;level=0;showSheet();
 }
 render();
}
function showSheet(){
 var l=L[level];
 document.getElementById("t").textContent=l.t;document.getElementById("d").textContent=l.d;
 pay.textContent=payLabel();document.getElementById('plans').style.display=level===0?'grid':'none';pay.disabled=false;no.textContent=l.c;no.disabled=false;
 sheet.classList.remove("qr");back.classList.add("show");
}
function reveal(msg){
 back.classList.remove("show");busy=false;sheet.classList.remove("qr");
 cur=String(result);acc=null;op=null;fresh=true;locked=false;render();toast(msg);
}
var tt;function toast(m){var e=document.getElementById("toast");e.textContent=m;e.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){e.classList.remove("show")},3800)}
var sheet=document.getElementById("sheet"),back2=document.getElementById("back2");
pay.onclick=function(){
 if(busy)return;var f=fee();
 document.getElementById("amt").textContent=f;back2.disabled=false;
 sheet.classList.add("qr");
};
back2.onclick=function(){if(!busy)sheet.classList.remove("qr")};
no.onclick=function(){
 if(busy)return;
 if(level<L.length-1){level++;showSheet()}
 else{level=0;showSheet();toast("Nice try 😈 Pay to unlock your result.")}
};
document.getElementById("keys").addEventListener("click",function(e){var b=e.target.closest("button");if(b)key(b.dataset.k)});
document.addEventListener("keydown",function(e){
 var m={"*":"×","/":"÷","-":"−","+":"+",Enter:"=","=":"=",Escape:"C",Backspace:"C",".":".","%":"pct"};
 var k=/^\d$/.test(e.key)?e.key:m[e.key];if(k){e.preventDefault();key(k)}
});
render();
